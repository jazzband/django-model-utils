[tox]
envlist =
    py{310,311,312,313,314}-dj{52}
    py{312,313,314}-dj{60,61,main}
    flake8
    isort
    mypy

[gh-actions]
python =
    3.10: py310
    3.11: py311, flake8, isort, mypy
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
deps =
    time-machine
    -rrequirements-test.txt
    dj52: Django==5.2.*
    dj60: Django==6.0.*
    dj61: Django==6.1.*
    djmain: https://github.com/django/django/archive/main.tar.gz
ignore_outcome =
    djmain: True
ignore_errors =
    djmain: True
passenv =
    CI
    FORCE_COLOR
    GITHUB_*
    POSTGRES_*
usedevelop = True
commands =
    python -m pytest {posargs}

[testenv:flake8]
basepython =
    python3.11
deps =
    flake8
skip_install = True
commands =
    flake8 model_utils tests

[flake8]
ignore =
    E731
    W503
    E402
    E501

[testenv:isort]
basepython = python3.11
deps = isort
commands =
    isort model_utils tests setup.py --check-only --diff
skip_install = True

[testenv:mypy]
basepython = python3.11
deps =
    -r requirements-mypy.txt
set_env =
    SQLITE=1
commands =
    mypy model_utils tests
